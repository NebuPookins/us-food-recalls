    date: 2026-07-29
    title: Modern Warrior Ready Dietary Supplement capsules contain unapproved ingredients
    summary:
      - dietary supplement
    recalling_firm: Modern Warrior Life, LLC
    agency: FDA
    hazards:
      - other
    classification: I
    products:
      - name: Modern Warrior Ready Dietary Supplement, 60 capsules
    distribution: Nationwide from April 2022 until December 8, 2025
    note: The FDA has recalled Modern Warrior Ready dietary supplement capsules after analysis found unapproved ingredients such as tianeptine, 1,4 DMAA, and aniracetam. Tianeptine can cause "life-threatening events" including "suicidal ideation" in people 25 and younger, according to FDA officials. The product was distributed nationwide between April 2022 and December 8, 2025. Consumers should stop using the supplement and contact the firm for a refund or disposal instructions. No illnesses or deaths have been reported.
