recalls:
  - id: 2026-08-dreyers-outshine-fruit-bars
    date: 2026-08-16
    title: Outshine Fruit Bars (five flavors)
    summary:
      - fruit bars
    recalling_firm: Dreyer's Grand Ice Cream, Inc.
    hazard: foreign-material
    distribution: Nationwide
    products:
      - name: Strawberry Fruit Bars, 6-count 2.5 oz paddle bars
        brand: Outshine
        codes:
          - UPC 041548610047
          - Best before 2027-09-30 through 2027-11-30
      - name: Grape Fruit Bars, 6-count 2.5 oz paddle bars
        brand: Outshine
        codes:
          - UPC 041548244044
          - Best before 2027-09-30 through 2027-10-31
      - name: Watermelon Fruit Bars, 6-count 2.5 oz paddle bars
        brand: Outshine
        codes:
          - UPC 041548413624
          - Best before 2027-06-30 through 2027-07-31
      - name: Black Cherry Fruit Bars, 6-count 2.5 oz paddle bars
        brand: Outshine
        codes:
          - UPC 041548000121
          - Best before 2027-07-31
      - name: Tangerine Fruit Bars, 6-count 2.5 oz paddle bars
        brand: Outshine
        codes:
          - UPC 041548612041
          - Best before 2027-10-31
    note: |
      A limited number of Outshine Fruit Bars (five flavors of 6-count,
      2.5-ounce paddle bars) may contain glass. Dreyer's Grand Ice Cream
      voluntarily recalled the products nationwide. No illnesses or injuries
      reported; consumers should discard or return them for a refund.
    citations:
      - title: Dreyer's Grand Ice Cream, Inc. Issues Voluntary Recall on Select Outshine Fruit Bars Due to Possible Foreign Matter Contamination
        url: https://www.prnewswire.com/news-releases/dreyers-grand-ice-cream-inc-issues-voluntary-recall-on-select-outshine-fruit-bars-due-to-possible-foreign-matter-contamination-302852376.html
        publisher: PR Newswire
        accessed: 2026-08-18
      - title: Outshine Fruit Bars recalled nationwide over possible glass contamination, company says
        url: https://www.cbsnews.com/news/outshine-fruit-bars-recall-glass-contamination-dreyers/
        publisher: CBS News
        accessed: 2026-08-18

  - id: 2026-08-kettle-cuisine-tomato-soup-kits
    date: 2026-08-12
    title: Marketside Tomato Bisque Soup Kits (Walmart)
    summary:
      - tomato bisque soup
    recalling_firm: Kettle Cuisine LLC
    agency: FDA
    hazard: listeria
    distribution: Walmart stores in 29 states
    products:
      - name: Marketside Tomato Bisque Soup Kit, 14 oz tray
        brand: Marketside
        codes:
          - UPC 194346474004
          - Best by 2026-08-22
    note: |
      Routine finished-product testing found a presumptive positive for Listeria
      monocytogenes. Kettle Cuisine recalled 3,240 packs sold only at Walmart
      stores in 29 states between June 30 and July 7, 2026. No illnesses reported.
    citations:
      - title: Walmart tomato soup kits recalled over Listeria contamination risk, FDA says
        url: https://www.cbsnews.com/losangeles/news/walmart-tomato-soup-kits-listeria-recall/
        publisher: CBS News
        accessed: 2026-08-18
      - title: Walmart recalls tomato soup kits sold in Delaware. What to know
        url: https://www.usatoday.com/story/grocery/2026/08/16/walmart-tomato-soup-kit-recall-in-delaware-how-to-identify-it/91327995007/
        publisher: USA Today
        accessed: 2026-08-18

  - id: 2026-08-taylor-fresh-jalapenos-salmonella
    date: 2026-08-09
    title: Fresh jalapeño salsa, guacamole and dips
    summary:
      - jalapeños
    recalling_firm: Taylor Fresh Foods (parent of Taylor Farms)
    agency: FDA
    hazard: salmonella
    distribution: Retail centers in 26 states
    illnesses: 345
    products:
      - name: Jalapeño-based salsa, guacamole, taco dip and sandwiches
        brand: Taylor Farms (also Trader Joe's, Kroger Private Selection, Freshness Guaranteed)
        codes:
          - Best if used by up to and including 2026-08-16
    note: |
      A multistate Salmonella outbreak was linked to fresh jalapeños grown in
      Sinaloa, Mexico and distributed by Coast Citrus Distributors. Taylor Fresh
      Foods recalled finished products containing the jalapeños; restaurants
      including Chipotle and QDOBA also stopped serving them. As of August 5 the
      CDC counted 345 illnesses and 36 hospitalizations across 27 states.
    citations:
      - title: Taylor Fresh Foods Recalls Products Made With Jalapeno Peppers Because of Possible Health Risk
        url: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/taylor-fresh-foods-recalls-products-made-jalapeno-peppers-because-possible-health-risk
        publisher: FDA
        accessed: 2026-08-18
      - title: Taylor Farms recalls jalapeno products over salmonella concerns
        url: https://apnews.com/article/taylor-fresh-foods-trump-jalapenos-lettuce-salmonella-6cc2f9e17fdd4cb45953c21bee841e1e
        publisher: AP News
        accessed: 2026-08-18

  - id: 2026-08-city-foods-pastrami-corned-beef
    date: 2026-08-08
    title: Ready-to-eat pastrami and corned beef
    summary:
      - pastrami
      - corned beef
    recalling_firm: City Foods, Inc. (dba Bea's Best Corned Beef)
    agency: FSIS
    hazard: listeria
    classification: I
    distribution: Illinois, Iowa and Michigan, then nationwide
    products:
      - name: Midamar Premium Beef Pastrami, 10-lb box
        brand: Midamar
        codes:
          - EST. 1896
          - Case code 19410
      - name: Bea's Best Cooked Corned Beef Brisket
        brand: Bea's Best
        codes:
          - EST. 1896
          - Case code 18919
      - name: Kirsch Delicatessen Style Cooked Corned Beef Brisket
        brand: Kirsch
        codes:
          - EST. 1896
          - Case code 19751
    note: |
      Roughly 3,215 pounds of ready-to-eat pastrami and corned beef produced
      July 16, 2026 may be contaminated with Listeria monocytogenes. The bulk
      products shipped to foodservice customers in Illinois, Iowa and Michigan,
      then reached delis and kitchens nationwide. Discovered during routine FSIS
      inspection; no illnesses reported.
    citations:
      - title: City Foods, Inc. Recalls Ready-To-Eat Pastrami and Corned Beef Products Due To Possible Listeria Contamination
        url: https://www.fsis.usda.gov/recalls-alerts/city-foods-inc--recalls-ready-eat-pastrami-and-corned-beef-products-due-possible
        publisher: FSIS
        accessed: 2026-08-18

