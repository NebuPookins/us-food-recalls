  - id: 2026-08-coast-citrus-jalapenos-salmonella
    date: 2026-08-09
    title: Fresh jalapeños (Coast Citrus Distributors)
    summary:
      - jalapeños
    recalling_firm: Coast Citrus Distributors
    agency: FDA
    hazard: salmonella
    distribution: Restaurants and retailers in 27 states
    illnesses: 345
    products:
      - name: Fresh jalapeños (grown in Sinaloa, Mexico)
        brand: Coast Citrus Distributors
    note: |
      A multistate Salmonella outbreak was traced to fresh jalapeños grown in
      Sinaloa, Mexico and distributed by Coast Citrus Distributors. As of
      August 5 the CDC counted 345 illnesses and 36 hospitalizations across 27
      states. Restaurants including Chipotle and QDOBA stopped serving the
      peppers, and several prepared-food firms recalled products made with them.
    citations:
      - title: Taylor Farms recalls jalapeno products over salmonella concerns
        url: https://apnews.com/article/taylor-fresh-foods-trump-jalapenos-lettuce-salmonella-6cc2f9e17fdd4cb45953c21bee841e1e
        publisher: AP News
        accessed: 2026-08-18
      - title: Taylor Farms recalls jalapeño products due to salmonella risk
        url: https://www.cnn.com/2026/08/10/health/salmonella-jalapeno-taylor-farms
        publisher: CNN
        accessed: 2026-08-18

