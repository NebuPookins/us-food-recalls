recalls:
  - id: 2026-08-indus-foods-gangothri-pickled-meat
    date: 2026-08-17
    title: Pickled goat and chicken products
    summary:
      - pickled goat & chicken
    recalling_firm: Indus Foods, LLC (dba Gangothri Foods)
    agency: FSIS
    hazard: processing-defect
    classification: I
    distribution: Nationwide (restaurants, retail and online)
    products:
      - name: Gangothri Goat Pickle, 8-oz jar
        brand: Gangothri Foods
      - name: Gangothri Gongura Goat Pickle, 8-oz jar
        brand: Gangothri Foods
      - name: Gangothri Chicken Pickle, 8-oz jar
        brand: Gangothri Foods
      - name: Gangothri Gongura Chicken Pickle, 8-oz jar
        brand: Gangothri Foods
    note: |
      About 1,626 pounds of ready-to-eat pickled goat and chicken were produced
      without federal inspection, discovered during FSIS surveillance. The jars
      have a two-year shelf life and may still be in pantries or on shelves. No
      confirmed illnesses reported.
    citations:
      - title: Indus Foods, LLC DBA Gangothri Foods Recalls Ready-To-Eat Pickled Goat and Chicken Products Produced Without Benefit of Inspection
        url: https://www.fsis.usda.gov/recalls-alerts/indus-foods-llc-dba-gangothri-foods-recalls-ready-eat-pickled-goat-and-chicken
        publisher: FSIS
        accessed: 2026-08-18

