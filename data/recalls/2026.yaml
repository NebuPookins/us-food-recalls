  - id: 2026-06-clover-hill-cheese-listeria
    date: 2026-06-03
    title: Requesón / ricotta and other cheeses
    summary:
      - soft cheese
    recalling_firm: Clover Hill Dairy, LLC
    agency: FDA
    hazard: listeria
    distribution: Maryland, Virginia, New York, North Carolina, New Jersey and Washington, D.C.
    illnesses: 12
    deaths: 1
    products:
      - name: Soft Ricotta / Requesón cheese (clamshells to 5-gal buckets)
        brand: Clover Hill Dairy
        codes:
          - Plant number 24-128
      - name: All other Clover Hill Dairy cheeses (cheddar, colby, Monterey Jack, flavored and smoked)
        brand: Clover Hill Dairy
        codes:
          - Plant number 24-128
    note: |
      A multi-year, multi-state Listeria outbreak was traced to soft requesón and
      other cheeses from Clover Hill Dairy. The company first recalled its
      ricotta/requesón in early June and expanded to all Clover Hill Dairy
      cheeses on June 18 after product and environmental samples matched the
      outbreak strain. As of late June there were 12 cases, 10 hospitalizations
      and one death across four states.
    citations:
      - title: Clover Hill Dairy Recalls Soft Ricotta/Requeson Cheese Due to Possible Health Risk
        url: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/clover-hill-dairy-recalls-soft-ricottarequeson-cheese-due-possible-health-risk
        publisher: FDA
        accessed: 2026-08-18
      - title: Clover Hill Dairy Expands Recall to Include All Clover Hill Dairy Brand Cheese Due to Possible Health Risk
        url: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/clover-hill-dairy-expands-recall-include-all-clover-hill-dairy-brand-cheese-due-possible-health-risk
        publisher: FDA
        accessed: 2026-08-18
      - title: "Investigation Update: Listeria Outbreak, June 2026"
        url: https://www.cdc.gov/listeria/outbreaks/soft-cheese-06-26/investigation.html
        publisher: CDC
        accessed: 2026-08-18

