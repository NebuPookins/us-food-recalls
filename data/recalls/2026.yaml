      About 13,720 pounds of ready-to-eat grilled chicken breast fillets produced
      October 14, 2025 may be contaminated with Listeria monocytogenes, detected
      by a third-party laboratory. Distributed to foodservice customers in seven
      states. No illnesses reported.
