  - id: 2026-07-midwest-poultry-shell-eggs
    date: 2026-07-22
    title: Shell eggs (Kroger, Brookshire's and other brands)
    summary:
      - eggs
    recalling_firm: Midwest Poultry Services, L.P.
    agency: FDA
    hazard: salmonella
    classification: I
    distribution: Texas, Oklahoma, Louisiana, Arkansas, Mississippi and New Mexico
    illnesses: 98
    products:
      - name: White and brown cage-free shell eggs
        brand: Kroger, Brookshire's, Country Morning, Simple Truth, Cal-Maine Sunups
        codes:
          - Plant P-1950 or 0840962
          - Julian dates 157 through 184
          - Best by 2026-07-20 through 2026-08-17
    note: |
      Midwest Poultry Services recalled roughly 1.59 million dozen shell eggs
      after environmental samples matched the Salmonella Enteritidis strain
      behind a 17-state outbreak (98 illnesses, 26 hospitalizations, no deaths).
      Eggs were produced at Texas farms between June 6 and July 3, 2026. The FDA
      upgraded the recall to Class I in August.
    citations:
      - title: Midwest Poultry Services. L.P. Recalls Shell Eggs Due to Possible Salmonella Enteritidis Contamination
        url: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/midwest-poultry-services-lp-recalls-shell-eggs-due-possible-salmonella-enteritidis-contamination
        publisher: FDA
        accessed: 2026-08-18
      - title: "Outbreak Investigation of Salmonella: Eggs (July 2026)"
        url: https://www.fda.gov/food/outbreaks-foodborne-illness/outbreak-investigation-salmonella-eggs-july-2026
        publisher: FDA
        accessed: 2026-08-18

  - id: 2026-07-taylor-farms-lettuce-cyclospora
    date: 2026-07-17
    title: Iceberg lettuce and shredded-lettuce products
    summary:
      - lettuce
    recalling_firm: Taylor Farms de Mexico
    agency: FDA
    hazard: other
    distribution: 27 states, plus Taco Bell restaurants in five states
    illnesses: 9481
    deaths: 2
    products:
      - name: Marketside Iceberg Salad, 12 oz and 24 oz
        brand: Marketside
        codes:
          - Best if used by 2026-07-18 through 2026-08-03
      - name: Marketside Shredded Lettuce, 8 oz and 16 oz
        brand: Marketside
        codes:
          - Best if used by 2026-07-18 through 2026-08-03
    note: |
      Iceberg lettuce sourced from central Mexico was linked to the largest
      cyclosporiasis outbreak on record, traced to shredded lettuce served at
      Taco Bell restaurants in five states. Taylor Farms de Mexico recalled all
      such lettuce from the US market. The FDA's final update counted 9,481
      illnesses, 398 hospitalizations and two deaths.
    citations:
      - title: "Multistate Outbreak of Cyclospora Illnesses: Iceberg Lettuce July 2026"
        url: https://www.fda.gov/food/outbreaks-foodborne-illness/investigation-multistate-outbreak-cyclospora-illnesses-iceberg-lettuce-july-2026
        publisher: FDA
        accessed: 2026-08-18
      - title: Taylor Farms lettuce sample produced false positive for cyclospora, FDA says
        url: https://www.nbcnews.com/health/health-news/fda-says-taylor-farms-lettuce-sample-tested-cyclospora-produced-false-rcna588303
        publisher: NBC News
        accessed: 2026-08-18

