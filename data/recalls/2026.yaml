  - id: 2026-08-hampton-grocer-lacnola-granola
    date: 2026-08-14
    title: Lacnola Lactation Granola
    summary:
      - granola
    recalling_firm: The Hampton Grocer, Inc.
    agency: FDA
    hazard: salmonella
    distribution: Nationwide via Amazon and other online retailers
    products:
      - name: Lacnola Lactation Granola, 8 oz stand-up pouch
        brand: Lacnola (The Hampton Grocer)
        codes:
          - UPC 850035324554
          - Lot HGLC-102125, exp 2026-10-21
          - Lot HGLC-021326, exp 2027-02-13
    note: |
      The Hampton Grocer recalled Lacnola Lactation Granola after its ingredient
      supplier reported that a sample of an organic greens powder containing
      moringa tested positive for Salmonella. The granola sold nationwide via
      Amazon and the company's website between October 2025 and August 2026. No
      illnesses reported.
